name: Phase 6 Data Warehouse Performance & Catalog CI

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-warehouse-performance:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradment_dw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pyyaml

      - name: Validate Phase 1 Event Catalog Contract
        run: |
          python scripts/validate_events_catalog.py

      - name: Validate Phase 3 Star Schema Contract
        run: |
          python scripts/validate_star_schema.py

      - name: Verify Native PostgreSQL DDL & EXPLAIN Partition Pruning
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/test_postgres_execution_and_pruning.py

      - name: Validate Phase 4 Pipeline Execution
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/validate_phase4_pipeline.py

      - name: Validate Phase 5 Data Quality Suite
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/validate_phase5_quality.py

      - name: Validate Phase 6 DW Performance & Data Catalog Artifacts
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/verify_phase6_dw_performance.py
          python scripts/validate_phase6_warehouse.py
