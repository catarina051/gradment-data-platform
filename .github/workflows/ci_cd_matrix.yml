name: GradMent Data Platform Consolidated CI/CD Pipeline Matrix

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate-platform-matrix:
    name: Validate Full Data Platform Matrix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gradment_dw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary pyyaml jsonschema matplotlib

      - name: Phase 1: Validate 39-Event Catalog Schema Contract
        run: python scripts/validate_events_catalog.py

      - name: Phase 3: Validate Star Schema Contract & PostgreSQL DDL
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/validate_star_schema.py
          python scripts/test_postgres_execution_and_pruning.py

      - name: Phase 4: Validate ETL/ELT Pipeline Execution
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: python scripts/validate_phase4_pipeline.py

      - name: Phase 5: Validate Data Quality & dbt Test Suite
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: python scripts/validate_phase5_quality.py

      - name: Phase 6: Validate Data Warehouse Performance & Index Scans
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: python scripts/validate_phase6_warehouse.py

      - name: Phase 7: Verify Metric Name Drift & Metrics Catalog
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/check_metrics_drift.py
          python scripts/validate_phase7_metrics.py

      - name: Phase 8: Validate 6 Role-Based Dashboards & Visual Showcase
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/generate_dashboards.py
          python scripts/generate_dashboard_screenshots.py
          python scripts/validate_phase8_dashboards.py

      - name: Phase 9: Validate Production Deployment & Health Checks
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASS: postgres
          PG_DB: gradment_dw_test
        run: |
          python scripts/health_check.py
          python scripts/validate_phase9_deployment.py
